name: esraa_app
description: تطبيق إسراء الشخصي - رفيق يومي لدكتورة إسراء مضوي
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1
  intl: ^0.19.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.0.0
  fl_chart: ^0.68.0
  local_auth: ^2.1.7
  home_widget: ^0.6.0
  flutter_animate: ^4.3.0
  google_fonts: ^6.1.0
  url_launcher: ^6.2.2
  share_plus: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
  # fonts are loaded via google_fonts package at runtime

